name: Cron with Auto Keepalive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  main-job:
    name: Main Job
    runs-on: ubuntu-latest
    # fork 上先只允许手动运行（避免反复禁用）
    if: ${{ github.event_name != 'schedule' || !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v6          # ← 已升级，解决 Node.js 20 警告
      # 这里放你原来的所有步骤（step1、step2...）

  keepalive:
    name: Auto Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6          # ← 必须升级
      - uses: efrecon/gh-action-keepalive@main   # ← 正确版本（已确认 2026 年 3 月还在维护）
