name: Cron with Auto Keepalive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  main-job:
    name: Main Job
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v6
      # 你的实际步骤...

  keepalive:
    name: Auto Keepalive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: efrecon/gh-action-keepalive@main
